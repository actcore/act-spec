name: publish-wit
on:
  push:
    tags: ['wit-v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-wit
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          bins: wkg   # needs wkg >= 0.16 for `publish --workspace`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # `--workspace` publishes every `[workspace] members` entry of wkg.toml in
      # dependency order; `--skip-dupes` leaves already-published versions alone,
      # so re-running on a later tag is a no-op for unchanged packages.
      # WKG_CONFIG_FILE makes the `act` namespace resolvable in a clean env.
      - name: Publish all act:* WIT packages
        env:
          WKG_CONFIG_FILE: ${{ github.workspace }}/wkg-registry.toml
        run: wkg publish --workspace --skip-dupes
